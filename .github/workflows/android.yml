name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check formatting and static analysis
        run: ./gradlew ktlintCheck detekt lintMockDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testMockDebugUnitTest :core:model:test :core:network:test :core:mock:test :core:designsystem:testDebugUnitTest :core:ui:testDebugUnitTest --stacktrace

      - name: Assemble the mock debug APK
        run: ./gradlew assembleMockDebug --stacktrace
