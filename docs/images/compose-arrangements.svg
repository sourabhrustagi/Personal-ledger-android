<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="boxGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="boxGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="boxGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Title Section -->
  <text x="500" y="38" text-anchor="middle" fill="url(#headerGrad)" font-size="22" font-weight="bold" letter-spacing="0.5">Jetpack Compose: Column &amp; Row Arrangements</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Arrangement controls the distribution and spacing of children along the Main Axis</text>

  <!-- COLUMN SECTION -->
  <rect x="25" y="80" width="950" height="280" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="45" y="108" fill="#38bdf8" font-size="16" font-weight="bold">Column: verticalArrangement (Main Axis: Vertical &#8595;)</text>
  <text x="530" y="108" fill="#64748b" font-size="12">Cross Axis: horizontalAlignment (Alignment.CenterHorizontally used)</text>

  <!-- Column 1: Top -->
  <g transform="translate(45, 125)">
    <rect width="115" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="57" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Arrangement.Top</text>
    <text x="57" y="34" text-anchor="middle" fill="#64748b" font-size="9">(Default)</text>
    <!-- Items at top -->
    <rect x="22" y="45" width="71" height="28" rx="6" fill="url(#boxGradA)"/>
    <text x="57" y="63" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item A</text>
    <rect x="22" y="77" width="71" height="28" rx="6" fill="url(#boxGradB)"/>
    <text x="57" y="95" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item B</text>
    <rect x="22" y="109" width="71" height="28" rx="6" fill="url(#boxGradC)"/>
    <text x="57" y="127" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item C</text>
    <line x1="57" y1="145" x2="57" y2="200" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="57" y="180" text-anchor="middle" fill="#64748b" font-size="9">Empty space</text>
  </g>

  <!-- Column 2: Center -->
  <g transform="translate(180, 125)">
    <rect width="115" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="57" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Arrangement.Center</text>
    <text x="57" y="34" text-anchor="middle" fill="#64748b" font-size="9">Centered cluster</text>
    <!-- Items at center -->
    <rect x="22" y="72" width="71" height="28" rx="6" fill="url(#boxGradA)"/>
    <text x="57" y="90" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item A</text>
    <rect x="22" y="104" width="71" height="28" rx="6" fill="url(#boxGradB)"/>
    <text x="57" y="122" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item B</text>
    <rect x="22" y="136" width="71" height="28" rx="6" fill="url(#boxGradC)"/>
    <text x="57" y="154" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item C</text>
    <text x="57" y="55" text-anchor="middle" fill="#64748b" font-size="8">&#189; Space</text>
    <text x="57" y="185" text-anchor="middle" fill="#64748b" font-size="8">&#189; Space</text>
  </g>

  <!-- Column 3: Bottom -->
  <g transform="translate(315, 125)">
    <rect width="115" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="57" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Arrangement.Bottom</text>
    <text x="57" y="34" text-anchor="middle" fill="#64748b" font-size="9">Packed to bottom</text>
    <line x1="57" y1="45" x2="57" y2="100" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="57" y="75" text-anchor="middle" fill="#64748b" font-size="9">Empty space</text>
    <!-- Items at bottom -->
    <rect x="22" y="115" width="71" height="28" rx="6" fill="url(#boxGradA)"/>
    <text x="57" y="133" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item A</text>
    <rect x="22" y="147" width="71" height="28" rx="6" fill="url(#boxGradB)"/>
    <text x="57" y="165" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item B</text>
    <rect x="22" y="179" width="71" height="28" rx="6" fill="url(#boxGradC)"/>
    <text x="57" y="197" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item C</text>
  </g>

  <!-- Column 4: SpaceBetween -->
  <g transform="translate(450, 125)">
    <rect width="115" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="57" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">SpaceBetween</text>
    <text x="57" y="34" text-anchor="middle" fill="#64748b" font-size="9">Edges flush, even gaps</text>
    <rect x="22" y="42" width="71" height="28" rx="6" fill="url(#boxGradA)"/>
    <text x="57" y="60" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item A</text>
    <text x="57" y="93" text-anchor="middle" fill="#38bdf8" font-size="9">gap</text>
    <rect x="22" y="112" width="71" height="28" rx="6" fill="url(#boxGradB)"/>
    <text x="57" y="130" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item B</text>
    <text x="57" y="163" text-anchor="middle" fill="#38bdf8" font-size="9">gap</text>
    <rect x="22" y="180" width="71" height="28" rx="6" fill="url(#boxGradC)"/>
    <text x="57" y="198" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item C</text>
  </g>

  <!-- Column 5: SpaceAround -->
  <g transform="translate(585, 125)">
    <rect width="115" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="57" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">SpaceAround</text>
    <text x="57" y="34" text-anchor="middle" fill="#64748b" font-size="9">&#189; gap at ends</text>
    <text x="57" y="48" text-anchor="middle" fill="#38bdf8" font-size="8">&#189; gap</text>
    <rect x="22" y="55" width="71" height="28" rx="6" fill="url(#boxGradA)"/>
    <text x="57" y="73" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item A</text>
    <text x="57" y="102" text-anchor="middle" fill="#38bdf8" font-size="9">1 gap</text>
    <rect x="22" y="112" width="71" height="28" rx="6" fill="url(#boxGradB)"/>
    <text x="57" y="130" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item B</text>
    <text x="57" y="159" text-anchor="middle" fill="#38bdf8" font-size="9">1 gap</text>
    <rect x="22" y="169" width="71" height="28" rx="6" fill="url(#boxGradC)"/>
    <text x="57" y="187" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item C</text>
    <text x="57" y="207" text-anchor="middle" fill="#38bdf8" font-size="8">&#189; gap</text>
  </g>

  <!-- Column 6: SpaceEvenly -->
  <g transform="translate(720, 125)">
    <rect width="115" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="57" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">SpaceEvenly</text>
    <text x="57" y="34" text-anchor="middle" fill="#64748b" font-size="9">All gaps equal</text>
    <text x="57" y="48" text-anchor="middle" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="22" y="52" width="71" height="28" rx="6" fill="url(#boxGradA)"/>
    <text x="57" y="70" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item A</text>
    <text x="57" y="96" text-anchor="middle" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="22" y="103" width="71" height="28" rx="6" fill="url(#boxGradB)"/>
    <text x="57" y="121" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item B</text>
    <text x="57" y="148" text-anchor="middle" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="22" y="156" width="71" height="28" rx="6" fill="url(#boxGradC)"/>
    <text x="57" y="174" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item C</text>
    <text x="57" y="202" text-anchor="middle" fill="#38bdf8" font-size="8">1 gap</text>
  </g>

  <!-- Column 7: spacedBy -->
  <g transform="translate(855, 125)">
    <rect width="105" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="52" y="20" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">spacedBy(16.dp)</text>
    <text x="52" y="34" text-anchor="middle" fill="#64748b" font-size="9">Fixed offset</text>
    <rect x="17" y="45" width="71" height="28" rx="6" fill="url(#boxGradA)"/>
    <text x="52" y="63" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item A</text>
    <text x="52" y="83" text-anchor="middle" fill="#f59e0b" font-size="8">16.dp</text>
    <rect x="17" y="88" width="71" height="28" rx="6" fill="url(#boxGradB)"/>
    <text x="52" y="106" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item B</text>
    <text x="52" y="126" text-anchor="middle" fill="#f59e0b" font-size="8">16.dp</text>
    <rect x="17" y="131" width="71" height="28" rx="6" fill="url(#boxGradC)"/>
    <text x="52" y="149" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Item C</text>
    <text x="52" y="185" text-anchor="middle" fill="#64748b" font-size="8">Residual space</text>
  </g>

  <!-- ROW SECTION -->
  <rect x="25" y="380" width="950" height="280" rx="12" fill="#131c2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="45" y="408" fill="#a855f7" font-size="16" font-weight="bold">Row: horizontalArrangement (Main Axis: Horizontal &#8594;)</text>
  <text x="530" y="408" fill="#64748b" font-size="12">Cross Axis: verticalAlignment (Alignment.CenterVertically used)</text>

  <!-- Row Rows -->
  <!-- Row 1: Start -->
  <g transform="translate(45, 425)">
    <rect width="440" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="10" y="14" fill="#94a3b8" font-size="9" font-weight="600">Arrangement.Start (Default)</text>
    <rect x="10" y="19" width="60" height="18" rx="4" fill="url(#boxGradA)"/>
    <text x="40" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item A</text>
    <rect x="74" y="19" width="60" height="18" rx="4" fill="url(#boxGradB)"/>
    <text x="104" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item B</text>
    <rect x="138" y="19" width="60" height="18" rx="4" fill="url(#boxGradC)"/>
    <text x="168" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item C</text>
    <text x="300" y="30" fill="#64748b" font-size="9">&#8594; Empty remaining space</text>
  </g>

  <!-- Row 2: Center -->
  <g transform="translate(515, 425)">
    <rect width="440" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="10" y="14" fill="#94a3b8" font-size="9" font-weight="600">Arrangement.Center</text>
    <rect x="125" y="19" width="60" height="18" rx="4" fill="url(#boxGradA)"/>
    <text x="155" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item A</text>
    <rect x="190" y="19" width="60" height="18" rx="4" fill="url(#boxGradB)"/>
    <text x="220" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item B</text>
    <rect x="255" y="19" width="60" height="18" rx="4" fill="url(#boxGradC)"/>
    <text x="285" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item C</text>
    <text x="50" y="30" fill="#64748b" font-size="8">&#189; Space</text>
    <text x="345" y="30" fill="#64748b" font-size="8">&#189; Space</text>
  </g>

  <!-- Row 3: End -->
  <g transform="translate(45, 480)">
    <rect width="440" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="10" y="14" fill="#94a3b8" font-size="9" font-weight="600">Arrangement.End</text>
    <text x="90" y="30" fill="#64748b" font-size="9">Empty remaining space &#8594;</text>
    <rect x="238" y="19" width="60" height="18" rx="4" fill="url(#boxGradA)"/>
    <text x="268" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item A</text>
    <rect x="302" y="19" width="60" height="18" rx="4" fill="url(#boxGradB)"/>
    <text x="332" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item B</text>
    <rect x="366" y="19" width="60" height="18" rx="4" fill="url(#boxGradC)"/>
    <text x="396" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item C</text>
  </g>

  <!-- Row 4: SpaceBetween -->
  <g transform="translate(515, 480)">
    <rect width="440" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="10" y="14" fill="#94a3b8" font-size="9" font-weight="600">Arrangement.SpaceBetween (e.g. Header &amp; Action CTA)</text>
    <rect x="8" y="19" width="60" height="18" rx="4" fill="url(#boxGradA)"/>
    <text x="38" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item A</text>
    <text x="115" y="31" fill="#38bdf8" font-size="8">&lt; gap &gt;</text>
    <rect x="190" y="19" width="60" height="18" rx="4" fill="url(#boxGradB)"/>
    <text x="220" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item B</text>
    <text x="300" y="31" fill="#38bdf8" font-size="8">&lt; gap &gt;</text>
    <rect x="372" y="19" width="60" height="18" rx="4" fill="url(#boxGradC)"/>
    <text x="402" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item C</text>
  </g>

  <!-- Row 5: SpaceAround -->
  <g transform="translate(45, 535)">
    <rect width="440" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="10" y="14" fill="#94a3b8" font-size="9" font-weight="600">Arrangement.SpaceAround</text>
    <text x="18" y="31" fill="#38bdf8" font-size="8">&#189; gap</text>
    <rect x="50" y="19" width="60" height="18" rx="4" fill="url(#boxGradA)"/>
    <text x="80" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item A</text>
    <text x="145" y="31" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="190" y="19" width="60" height="18" rx="4" fill="url(#boxGradB)"/>
    <text x="220" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item B</text>
    <text x="285" y="31" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="330" y="19" width="60" height="18" rx="4" fill="url(#boxGradC)"/>
    <text x="360" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item C</text>
    <text x="405" y="31" fill="#38bdf8" font-size="8">&#189; gap</text>
  </g>

  <!-- Row 6: SpaceEvenly -->
  <g transform="translate(515, 535)">
    <rect width="440" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="10" y="14" fill="#94a3b8" font-size="9" font-weight="600">Arrangement.SpaceEvenly</text>
    <text x="15" y="31" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="45" y="19" width="60" height="18" rx="4" fill="url(#boxGradA)"/>
    <text x="75" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item A</text>
    <text x="135" y="31" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="175" y="19" width="60" height="18" rx="4" fill="url(#boxGradB)"/>
    <text x="205" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item B</text>
    <text x="265" y="31" fill="#38bdf8" font-size="8">1 gap</text>
    <rect x="305" y="19" width="60" height="18" rx="4" fill="url(#boxGradC)"/>
    <text x="335" y="32" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">Item C</text>
    <text x="395" y="31" fill="#38bdf8" font-size="8">1 gap</text>
  </g>

  <!-- Row 7: spacedBy -->
  <g transform="translate(45, 590)">
    <rect width="910" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="2 2"/>
    <text x="15" y="18" fill="#f59e0b" font-size="11" font-weight="bold">Arrangement.spacedBy(12.dp)</text>
    <text x="230" y="18" fill="#94a3b8" font-size="10">Guarantees a fixed physical gap between every child without manual spacing modifiers</text>
    <rect x="15" y="27" width="80" height="22" rx="4" fill="url(#boxGradA)"/>
    <text x="55" y="42" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Chip 1</text>
    <text x="107" y="41" fill="#f59e0b" font-size="9">12.dp</text>
    <rect x="123" y="27" width="80" height="22" rx="4" fill="url(#boxGradB)"/>
    <text x="163" y="42" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Chip 2</text>
    <text x="215" y="41" fill="#f59e0b" font-size="9">12.dp</text>
    <rect x="231" y="27" width="80" height="22" rx="4" fill="url(#boxGradC)"/>
    <text x="271" y="42" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Chip 3</text>
    <text x="323" y="41" fill="#f59e0b" font-size="9">12.dp</text>
    <rect x="339" y="27" width="80" height="22" rx="4" fill="url(#boxGradA)"/>
    <text x="379" y="42" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Chip 4</text>
    <line x1="430" y1="38" x2="600" y2="38" stroke="#475569" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="615" y="42" fill="#64748b" font-size="10">Remaining available layout space</text>
  </g>
</svg>
